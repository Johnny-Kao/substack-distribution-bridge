name: Read-only discovery
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: substack-read-discovery
  cancel-in-progress: false
jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic QC unit tests
        run: python -m unittest discover -s tests -v
      - name: Write authorization and fail-closed tests (no secrets)
        run: node --test tests/write_policy.test.mjs
  discover:
    needs: qc
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Random scheduling offset
        run: sleep $((RANDOM % 181))
      - name: Keyword discovery and private ingest
        env:
          BRIDGE_URL: ${{ vars.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BRIDGE_URL:-}" || -z "${BRIDGE_KEY:-}" ]]; then
            echo "Bridge is not configured; skipping."
            exit 0
          fi
          python -m scripts.discover
