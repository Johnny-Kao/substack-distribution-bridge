name: Read-only discovery
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: substack-read-discovery
  cancel-in-progress: false
jobs:
  qc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Deterministic QC unit tests
        run: python -m unittest discover -s tests -v
      - name: Cloud-only authorization and fail-closed tests (no secrets)
        run: node --test tests/write_policy.test.mjs tests/feed.test.mjs tests/subject.test.mjs tests/subject_discovery.test.mjs
  discover:
    needs: qc
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Random scheduling offset
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 181))
      - name: Keyword discovery and private ingest
        env:
          BRIDGE_URL: ${{ vars.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BRIDGE_URL:-}" || -z "${BRIDGE_KEY:-}" ]]; then
            echo "Bridge is not configured; discovery cannot run."
            exit 1
          fi
          python -m scripts.discover
