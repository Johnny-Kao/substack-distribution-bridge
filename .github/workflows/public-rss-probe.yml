name: Temporary public RSS availability probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Only inspect public RSS HTTP status
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          for host in ("johnnykao.substack.com","tamemma.substack.com"):
              req=urllib.request.Request("https://"+host+"/feed",headers={"Accept":"application/rss+xml","User-Agent":"Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      print("rss",host,r.status,(r.headers.get("Content-Type") or "").split(";")[0])
              except urllib.error.HTTPError as e:
                  print("rss",host,e.code,(e.headers.get("Content-Type") or "").split(";")[0])
              except Exception as e: print("rss",host,type(e).__name__)
          PY
