name: Private read-only subject discovery
on:
  schedule:
    - cron: '11 */12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: substack-private-subject-discovery
  cancel-in-progress: false
jobs:
  subject:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - name: Trigger one bounded cloud subject search step
        env:
          BRIDGE_URL: ${{ vars.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BRIDGE_URL:-}" || -z "${BRIDGE_KEY:-}" ]]; then
            echo "Private discovery bridge is unconfigured"
            exit 1
          fi
          python -m scripts.run_subject_step
