name: Private global post discovery
on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "worker/**"
      - "scripts/run_global_step.py"
      - "tests/**"
      - ".github/workflows/global-discovery.yml"
permissions:
  contents: read
concurrency:
  group: substack-private-global-post-discovery
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test all read-only discovery and two-stage AI logic
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix worker --no-audit --no-fund
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -q
          (cd worker && npx wrangler deploy --dry-run --outdir=./.wrangler-verify)
      - name: Deploy the fully tested cloud Worker
        working-directory: worker
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler deploy
      - name: Initialize private feedback schema via Worker binding
        env:
          BRIDGE_URL: ${{ vars.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request
          base=os.environ['BRIDGE_URL'].rstrip('/')
          req=urllib.request.Request(base+'/v1/global/setup-feedback',method='POST',data=b'{}',headers={'Authorization':'Bearer '+os.environ['BRIDGE_KEY'],'Content-Type':'application/json','User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=55) as result:data=json.load(result)
          if data.get('ok') is not True or data.get('ready') is not True:raise SystemExit('D1 feedback schema not verified')
          print('Private feedback schema verified; previously recorded events='+str(data.get('existing_feedback_count',0)))
          PY
  discover:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - name: Run full cloud global search, article read, and two-stage AI pipeline
        env:
          BRIDGE_URL: ${{ vars.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BRIDGE_URL:-}" || -z "${BRIDGE_KEY:-}" ]]; then
            echo "Private discovery bridge is unconfigured"
            exit 1
          fi
          python3 -m unittest discover -s tests -q
          python3 -m scripts.run_global_step
