name: Private global post discovery
on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: substack-private-global-post-discovery
  cancel-in-progress: false
jobs:
  global:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - name: Trigger one bounded cloud global search page
        env:
          BRIDGE_URL: ${{ vars.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BRIDGE_URL:-}" || -z "${BRIDGE_KEY:-}" ]]; then
            echo "Private discovery bridge is unconfigured"
            exit 1
          fi
          python -m unittest discover -s tests -q
          python -m scripts.run_global_step
