name = "substack-distribution-bridge"
main = "src/index.js"
compatibility_date = "2026-10-23"
workers_dev = true
compatibility_flags = ["nodejs_compat"]
[[d1_databases]]
binding = "DB"
database_name = "substack-distribution-private"
database_id = "1ae103d8-90c0-4f66-9e82-1c44eb59544d"

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

# Runs a separate owner-approved action outbox. No discovery or auto approval.
[triggers]
crons = ["17 * * * *"]
